plugins { id 'com.android.application' }

android {
    namespace 'com.mtk.store'
    compileSdk 35
    defaultConfig {
        applicationId 'com.mtk.store'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }
    signingConfigs {
        release {
            if (System.getenv('MTK_KS')) {
                storeFile file(System.getenv('MTK_KS'))
                storePassword System.getenv('MTK_KS_PASS')
                keyAlias 'mtk'
                keyPassword System.getenv('MTK_KS_PASS')
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('MTK_KS')) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
