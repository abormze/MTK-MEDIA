name: KIDS catalog
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/kids_catalog.py
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add kids/cat.json
          git diff --cached --quiet || (git commit -m "KIDS catalog refresh" && git push)
