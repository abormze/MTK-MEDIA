plugins { id 'com.android.application' }

android {
    namespace 'com.mtk.media'
    compileSdk 34
    defaultConfig {
        applicationId 'com.mtk.media'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '1.2'
    }
    signingConfigs {
        release {
            if (System.getenv('MTK_KS')) {
                storeFile file(System.getenv('MTK_KS'))
                storePassword System.getenv('MTK_KS_PASS')
                keyAlias 'mtk'
                keyPassword System.getenv('MTK_KS_PASS')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('MTK_KS')) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies { implementation 'androidx.webkit:webkit:1.11.0' }

tasks.register('copyUserscript', Copy) {
    from "$rootDir/../mtk-media.user.js"
    from "$projectDir/adhosts.txt"
    into "$projectDir/src/main/assets"
}
preBuild.dependsOn 'copyUserscript'
